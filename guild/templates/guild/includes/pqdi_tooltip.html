<style>
    #pqdi-tooltip {
        position: fixed;
        z-index: 10000;
        width: 474px;
        max-width: calc(100vw - 20px);
        max-height: calc(100vh - 20px);
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #555;
        border-radius: 5px;
        background: #3c3c3c;
        color: #fff;
        box-shadow: 0 6px 20px rgb(0 0 0 / 35%);
        font: 13px/1.4 Arial, sans-serif;
        pointer-events: none;
        overflow: hidden;
    }

    #pqdi-tooltip[hidden] {
        display: none;
    }

    #pqdi-tooltip > div {
        max-width: 100%;
    }

    #pqdi-tooltip h4 {
        margin: 0 0 10px;
        color: #fff;
        font-size: 23px;
        font-weight: bold;
    }

    #pqdi-tooltip table {
        margin: 0;
        min-width: 0;
        max-width: 100%;
        border-collapse: collapse;
    }

    #pqdi-tooltip table,
    #pqdi-tooltip tr,
    #pqdi-tooltip td {
        background: transparent;
        border: 0;
        color: inherit;
        box-shadow: none;
    }

    #pqdi-tooltip td {
        padding: 0;
        text-align: left;
    }

    #pqdi-tooltip img {
        display: inline-block;
        vertical-align: middle;
    }
</style>

<div id="pqdi-tooltip" role="tooltip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<script>
(() => {
    const tooltip = document.getElementById("pqdi-tooltip");
    const cache = new Map();

    let activeLink = null;
    let requestVersion = 0;

    function positionTooltip(link) {
        const rect = link.getBoundingClientRect();
        const width = tooltip.offsetWidth;
        const height = tooltip.offsetHeight;

        // Prefer above the link, otherwise display below.
        let top = rect.top - height - 8;

        if (top < 10) {
            top = rect.bottom + 8;
        }

        const left = Math.max(
            10,
            Math.min(rect.left, window.innerWidth - width - 10)
        );

        top = Math.max(
            10,
            Math.min(top, window.innerHeight - height - 10)
        );

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        requestVersion++;

        if (activeLink) {
            activeLink.removeAttribute("aria-describedby");
        }

        activeLink = null;
        tooltip.hidden = true;
    }

    async function loadTooltip(id) {
        if (!cache.has(id)) {
            const pending = (async () => {
                const controller = new AbortController();
                const timeout = setTimeout(
                    () => controller.abort(),
                    10000
                );

                try {
                    const response = await fetch(
                        `https://www.pqdi.cc/get-item-tooltip/${id}`,
                        {
                            credentials: "omit",
                            signal: controller.signal
                        }
                    );

                    if (!response.ok) {
                        throw new Error(
                            `PQDI returned ${response.status}`
                        );
                    }

                    let html = await response.text();

                    // Fix relative paths for item sprites and coin icons.
                    html = html.replaceAll(
                        "/static/",
                        "https://www.pqdi.cc/static/"
                    );

                    if (!window.DOMPurify) {
                        throw new Error(
                            "Tooltip sanitizer unavailable"
                        );
                    }

                    return DOMPurify.sanitize(html, {
                        USE_PROFILES: { html: true },
                        FORBID_TAGS: ["style"],
                        FORBID_ATTR: ["id"]
                    });
                } finally {
                    clearTimeout(timeout);
                }
            })();

            cache.set(id, pending);

            // Allow failed requests to be retried on the next hover.
            pending.catch(() => {
                cache.delete(id);
            });
        }

        return cache.get(id);
    }

    async function showTooltip(link) {
        const id = link.dataset.pqdiItemId;

        if (!/^\d+$/.test(id)) {
            return;
        }

        hideTooltip();
        activeLink = link;

        const version = requestVersion;

        link.setAttribute("aria-describedby", "pqdi-tooltip");
        tooltip.textContent = "Loading item…";
        tooltip.hidden = false;
        positionTooltip(link);

        try {
            const html = await loadTooltip(id);

            // Ignore responses from an earlier hover.
            if (
                activeLink !== link ||
                version !== requestVersion
            ) {
                return;
            }

            tooltip.innerHTML = html;
            positionTooltip(link);

            tooltip.querySelectorAll("img").forEach(img => {
                img.addEventListener("load", () => {
                    if (
                        activeLink === link &&
                        version === requestVersion
                    ) {
                        positionTooltip(link);
                    }
                }, { once: true });
            });
        } catch (error) {
            if (
                activeLink !== link ||
                version !== requestVersion
            ) {
                return;
            }

            tooltip.textContent = "Item details unavailable.";
            positionTooltip(link);
        }
    }

    document.querySelectorAll("[data-pqdi-item-id]").forEach(link => {
        link.addEventListener("mouseenter", () => {
            showTooltip(link);
        });

        link.addEventListener("mouseleave", () => {
            if (activeLink === link) {
                hideTooltip();
            }
        });

        link.addEventListener("focus", () => {
            showTooltip(link);
        });

        link.addEventListener("blur", () => {
            if (activeLink === link) {
                hideTooltip();
            }
        });
    });

    window.addEventListener("scroll", hideTooltip, true);
    window.addEventListener("resize", hideTooltip);

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            hideTooltip();
        }
    });
})();
</script>
